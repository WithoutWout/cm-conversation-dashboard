name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Save the cache even if a later step (e.g. notarization) fails —
          # otherwise a full crate recompile is thrown away on every retry.
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: |
            ## What's new in v0.11.0

            Conversations search has been rebuilt. Two of the changes below mean it was
            returning the **wrong conversations**, not just slow ones — if you have relied
            on a search recently, it is worth running it again.

            ### Fixed: searching user messages also matched the bot

            With only **U** selected, a search still returned conversations where only the
            bot had said the word. The scope was being applied to the first search term
            only, so everything after an `|` searched everywhere.

            The same fix stops an unscoped search from quietly matching Article and Dialog
            IDs — a plain number used to find conversations by their dialog path rather
            than by anything anyone said.

            ### Fixed: terms with dots, dashes or symbols returned nothing

            `www.efteling.nl`, `qa-1234` and `€10,-` failed outright rather than searching.
            They work now, and match exactly — `www.efteling.nl` no longer also matches
            "www efteling nl". A term made only of symbols now falls back to a plain text
            search instead of silently returning **every** conversation.

            ### Searching by ID is roughly 1000x faster, and now exact

            Searching by Article or Dialog ID went from about **5 seconds to a few
            milliseconds** on a database of 110,000 interactions.

            It is also correct now: `qa-123` no longer also matches `qa-1234`, and
            `6391-4` no longer matches node `42`.

            ### Dialog ID and Node ID are one filter

            Instead of picking between **Dialog ID** and **Node ID**, type either into the
            same box. A `-` is what says you gave a node: `6391` finds every conversation
            that touched the dialog, `6391-4` narrows it to that one node — whether the bot
            answered from it or only passed through it.

            ### New: search by triggered Entity

            A new **E** button next to **U** and **B** searches the entities the bot
            recognised, rather than the words that were typed. Searching `WIJN` finds
            "mag ik een fles rood meenemen" — a conversation where the word never appears.

            - Matches the entity name, the text that triggered it, or the Entity ID.
            - **U + E is now the default**: what someone asked for, and what the bot
              understood it as. Switch **U** off for entities only.
            - Opening a result filters the conversation to the turns that matched, and
              marks the entity that put it there.

            ### Fixed: searching in a conversation missed accented words

            Searching `cafe` in the conversation list found messages containing `café`, but
            opening one of those results said *no messages match*. Both searches now treat
            accents the same way.

            ### Entities tab

            - **New Conversations button** on every entity — opens the conversation search
              showing every conversation that entity was triggered in.
            - **Fixed: attached Articles were missing.** An Article could show
              *Entity: WIJN* on its chip while WIJN's own view did not list that Article.
              On a real export this affected **almost half of all entities** — 2013
              entities now show their Articles, up from 1167. The **Used in Articles** and
              **Used in Dialogs** filters were wrong in the same way and are fixed with it.

            ### Export for AI tells you it is working

            A large export runs for several seconds with nothing on screen moving. It now
            shows a progress message — *Collecting search results…*, then *Writing 4,182
            conversations · 31,940 interactions…* — that stays up until the export
            finishes.

            > **First launch after updating** takes a few seconds longer than usual: the
            > app indexes the entities already in your database, and rebuilds its search
            > index once. This happens only once.

            ---

            ## Download

            ### Windows (geen admin nodig, geen installatie) — aanbevolen
            - Klik hieronder op **Assets** en download:
              `Conversational-AI-Dashboard-portable-${{ github.ref_name }}-x64.zip`
            - Pak het zip-bestand uit en dubbelklik op `CAIDashboard.exe`.
            - Geen installatie nodig. Je kunt het bestand op elke locatie bewaren.

            > ⚠️ Let op: de app is niet gecode‑signed. Windows Defender/SmartScreen kan een waarschuwing tonen.
            > Klik op **"Meer informatie" → "Toch uitvoeren"** om de app te starten.

            ---

            ### macOS
            - Download het `.dmg`‑bestand.
            - Open het `.dmg`, sleep de app naar `Applications` en open hem via `Launchpad`/`Programma's`.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Zip portable Windows binary
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "src-tauri/target" -Recurse -Filter "CAIDashboard.exe" |
            Where-Object { $_.FullName -match "\\release\\" -and $_.FullName -notmatch "\\(deps|build|examples)\\" } |
            Select-Object -First 1
          if (-not $exe) { Write-Error "CAIDashboard.exe not found"; exit 1 }
          Write-Host "Found binary: $($exe.FullName)"
          $version = "${{ github.ref_name }}"
          $zipName = "Conversational-AI-Dashboard-portable-${version}-x64.zip"
          Compress-Archive -Path $exe.FullName -DestinationPath $zipName
          echo "ZIP_PATH=$zipName" >> $env:GITHUB_ENV

      - name: Upload portable zip to release
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
