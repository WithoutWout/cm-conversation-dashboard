name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Both jobs write `latest.json` to the same release, and tauri-action
      # merges it read-modify-write. Run them one at a time or the second
      # upload can drop the first platform's entry.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Save the cache even if a later step (e.g. notarization) fails —
          # otherwise a full crate recompile is thrown away on every retry.
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts. Without these the build still succeeds
          # but produces no .sig files, and every client rejects the update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          # This text is also the release-notes panel inside the app's update
          # dialog: tauri-action copies the release body into `latest.json` as
          # `notes`, and `check_for_updates` passes it to the renderer. Rewrite
          # it per release — stale notes are now visible in two places.
          releaseBody: |
            ## What's new in v0.13.0

            A tidier Settings screen, a backup that actually restores everything,
            and a fix for automatic updates on macOS.

            ### Settings backup is now complete

            **Settings → Backup…** now saves your Analytics API credentials too —
            client ID, client secret, customer key and project key. Restoring a
            backup on a new machine used to leave you re-entering all of them by
            hand, which meant it was not really a backup.

            > ⚠️ **The backup file now contains live credentials.** Anyone who
            > opens it can read your CM.com data. Treat it exactly like a password:
            > don't email it, don't put it in shared storage, and delete it once
            > you've restored. The app warns you before writing it, and on macOS
            > and Linux the file is created readable only by you.

            Your database path and data folder are still left out — restoring those
            on another machine just points the app at something that isn't there.

            ### Settings is less cluttered

            The backup panel used to sit at the top of Settings, pushing the actual
            settings down behind a heading, a description, two buttons and a
            warning. It now lives behind a **Backup…** button in the Settings
            header, so the first thing you see is the setting you came to change.

            ### Fixed: automatic updates on macOS

            v0.12.0 introduced self-updating, but macOS builds shipped without the
            file the updater needs — so Macs reported themselves up to date
            forever. Fixed. **If you are on v0.12.0 on a Mac, this release will be
            offered to you normally**, and updates work from here on.

            Windows was unaffected.

            ---

            ## Download

            You only need this once. After installing this version, future updates
            arrive inside the app.

            ### Windows (geen admin nodig, geen installatie) — aanbevolen
            - Klik hieronder op **Assets** en download:
              `Conversational-AI-Dashboard-portable-${{ github.ref_name }}-x64.zip`
            - Pak het zip-bestand uit en dubbelklik op `CAIDashboard.exe`.
            - Geen installatie nodig. Je kunt het bestand op elke locatie bewaren —
              maar kies een map waar je zelf in kunt schrijven, zodat de app zichzelf
              kan bijwerken.

            > ⚠️ Let op: de app is niet gecode‑signed. Windows Defender/SmartScreen kan een waarschuwing tonen.
            > Klik op **"Meer informatie" → "Toch uitvoeren"** om de app te starten.
            > Dit is eenmalig: updates die de app zelf ophaalt, starten zonder deze waarschuwing.

            ---

            ### macOS
            - Download het `.dmg`‑bestand.
            - Open het `.dmg`, sleep de app naar `Applications` en open hem via `Launchpad`/`Programma's`.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Zip portable Windows binary
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "src-tauri/target" -Recurse -Filter "CAIDashboard.exe" |
            Where-Object { $_.FullName -match "\\release\\" -and $_.FullName -notmatch "\\(deps|build|examples)\\" } |
            Select-Object -First 1
          if (-not $exe) { Write-Error "CAIDashboard.exe not found"; exit 1 }
          Write-Host "Found binary: $($exe.FullName)"
          $version = "${{ github.ref_name }}"
          $zipName = "Conversational-AI-Dashboard-portable-${version}-x64.zip"
          Compress-Archive -Path $exe.FullName -DestinationPath $zipName
          echo "ZIP_PATH=$zipName" >> $env:GITHUB_ENV

      # The portable zip is built here, after tauri-action, so it is not one of
      # the artifacts tauri-action signs. It is what the portable build
      # downloads to update itself, so it needs a signature of its own — from
      # the same key, verified by the same pubkey in tauri.conf.json.
      - name: Sign portable zip
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx --yes @tauri-apps/cli@2 signer sign "$env:ZIP_PATH"
          if (-not (Test-Path "$($env:ZIP_PATH).sig")) {
            Write-Error "signer produced no .sig for $env:ZIP_PATH"; exit 1
          }

      - name: Upload portable zip to release
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP_PATH }}
            ${{ env.ZIP_PATH }}.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # `latest.json` is what every installed copy reads to decide whether there is
  # an update and which artifact to fetch. tauri-action writes one entry per
  # bundle it produced — but the portable zip is not one of its bundles, so the
  # key the portable build asks for (`windows-portable`, from
  # `self_update::updater_target`) has to be added afterwards.
  #
  # A separate job rather than another step in the Windows one: both matrix jobs
  # already rewrite latest.json read-modify-write, and a third writer inside the
  # matrix would race them. `needs: build` puts this strictly after both.
  finalize-updater-manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Add the portable target to latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ZIP="Conversational-AI-Dashboard-portable-${TAG}-x64.zip"

          gh release download "$TAG" --repo "$REPO" --pattern 'latest.json' --clobber
          gh release download "$TAG" --repo "$REPO" --pattern "${ZIP}.sig" --clobber

          node -e '
            const fs = require("fs")
            const [zip, tag, repo] = process.argv.slice(1)
            const manifest = JSON.parse(fs.readFileSync("latest.json", "utf8"))

            // A stale manifest would hand every client the wrong artifact while
            // looking entirely healthy, so fail the release instead.
            if (manifest.version !== tag.replace(/^v/, "")) {
              throw new Error(
                `latest.json is for ${manifest.version}, tag is ${tag}`
              )
            }

            manifest.platforms = manifest.platforms || {}
            manifest.platforms["windows-portable"] = {
              signature: fs.readFileSync(zip + ".sig", "utf8").trim(),
              url: `https://github.com/${repo}/releases/download/${tag}/${zip}`,
            }
            fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2))
            console.log("platforms: " + Object.keys(manifest.platforms).join(", "))
          ' "$ZIP" "$TAG" "$REPO"

          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
