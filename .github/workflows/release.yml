name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Both jobs write `latest.json` to the same release, and tauri-action
      # merges it read-modify-write. Run them one at a time or the second
      # upload can drop the first platform's entry.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          # --no-bundle because Windows ships only the portable zip, which the
          # steps below build from the plain .exe. There is no Windows bundle
          # left to produce: `bundle.targets` is macOS-only.
          - platform: windows-latest
            args: "--no-bundle"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Save the cache even if a later step (e.g. notarization) fails —
          # otherwise a full crate recompile is thrown away on every retry.
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts. Without these the build still succeeds
          # but produces no .sig files, and every client rejects the update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          # This text is also the release-notes panel inside the app's update
          # dialog: tauri-action copies the release body into `latest.json` as
          # `notes`, and `check_for_updates` passes it to the renderer. Rewrite
          # the "What's new" section per release — stale notes are now visible in
          # two places. The heading takes the tag so at least the version cannot
          # go stale on its own. English only: the audience is mixed.
          releaseBody: |
            ## What's new in ${{ github.ref_name }}

            ### Every conversation opens in Halo Studio

            The **Open in Halo Studio** button used to appear only on
            conversations that contained an AI answer, so most conversations had
            no way through. It is now on every conversation, as soon as the Halo
            Studio URL is filled in under **Settings → Conversations**. Flagged
            conversations have it too, which they never did.

            ### Tidier conversation list

            The language tag (`nl`, `en`, `de`, …) in the search results is now
            the same size on every row, instead of changing width with the code
            it happens to show and shifting when a row carried a feedback icon.

            ### One download per platform

            Windows no longer has two downloads to choose between. The installer
            has been dropped and the portable version is now the only one — it
            updates itself, needs no administrator rights, and works in places
            where installers are blocked. Pick Windows or Mac and you're done.

            Nothing changes if you already run the portable version, which is
            everyone.

            ---

            ## Download

            Click **Assets** below and pick the file for your computer. You only
            need to do this once — after that the app updates itself.

            ### Windows
            `Conversational-AI-Dashboard-portable-${{ github.ref_name }}-x64.zip`

            - Unzip it and double-click `CAIDashboard.exe`.
            - No installation, no administrator rights. Keep it wherever you like —
              but pick a folder you can write to, so the app can update itself.

            > ⚠️ The app is not code-signed, so Windows Defender/SmartScreen may
            > warn you. Click **"More info" → "Run anyway"**. This is a one-off:
            > updates the app downloads itself start without that warning.

            ### macOS (Apple Silicon)
            `Conversational.AI.Dashboard_*_aarch64.dmg`

            - Open the `.dmg`, drag the app to `Applications`, and start it from
              Launchpad.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Zip portable Windows binary
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "src-tauri/target" -Recurse -Filter "CAIDashboard.exe" |
            Where-Object { $_.FullName -match "\\release\\" -and $_.FullName -notmatch "\\(deps|build|examples)\\" } |
            Select-Object -First 1
          if (-not $exe) { Write-Error "CAIDashboard.exe not found"; exit 1 }
          Write-Host "Found binary: $($exe.FullName)"
          $version = "${{ github.ref_name }}"
          $zipName = "Conversational-AI-Dashboard-portable-${version}-x64.zip"
          Compress-Archive -Path $exe.FullName -DestinationPath $zipName
          echo "ZIP_PATH=$zipName" >> $env:GITHUB_ENV

      # The portable zip is built here, after tauri-action, so it is not one of
      # the artifacts tauri-action signs. It is what the portable build
      # downloads to update itself, so it needs a signature of its own — from
      # the same key, verified by the same pubkey in tauri.conf.json.
      - name: Sign portable zip
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx --yes @tauri-apps/cli@2 signer sign "$env:ZIP_PATH"
          if (-not (Test-Path "$($env:ZIP_PATH).sig")) {
            Write-Error "signer produced no .sig for $env:ZIP_PATH"; exit 1
          }

      - name: Upload portable zip to release
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP_PATH }}
            ${{ env.ZIP_PATH }}.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # `latest.json` is what every installed copy reads to decide whether there is
  # an update and which artifact to fetch. tauri-action writes one entry per
  # bundle it produced — but the portable zip is not one of its bundles, so the
  # key the portable build asks for (`windows-portable`, from
  # `self_update::updater_target`) has to be added afterwards.
  #
  # A separate job rather than another step in the Windows one: both matrix jobs
  # already rewrite latest.json read-modify-write, and a third writer inside the
  # matrix would race them. `needs: build` puts this strictly after both.
  finalize-updater-manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Add the portable target to latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ZIP="Conversational-AI-Dashboard-portable-${TAG}-x64.zip"

          gh release download "$TAG" --repo "$REPO" --pattern 'latest.json' --clobber
          gh release download "$TAG" --repo "$REPO" --pattern "${ZIP}.sig" --clobber

          node -e '
            const fs = require("fs")
            const [zip, tag, repo] = process.argv.slice(1)
            const manifest = JSON.parse(fs.readFileSync("latest.json", "utf8"))

            // A stale manifest would hand every client the wrong artifact while
            // looking entirely healthy, so fail the release instead.
            if (manifest.version !== tag.replace(/^v/, "")) {
              throw new Error(
                `latest.json is for ${manifest.version}, tag is ${tag}`
              )
            }

            manifest.platforms = manifest.platforms || {}
            manifest.platforms["windows-portable"] = {
              signature: fs.readFileSync(zip + ".sig", "utf8").trim(),
              url: `https://github.com/${repo}/releases/download/${tag}/${zip}`,
            }
            fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2))
            console.log("platforms: " + Object.keys(manifest.platforms).join(", "))
          ' "$ZIP" "$TAG" "$REPO"

          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
