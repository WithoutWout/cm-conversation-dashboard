name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Save the cache even if a later step (e.g. notarization) fails —
          # otherwise a full crate recompile is thrown away on every retry.
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: |
            ## What's new in v0.10.2

            ### Collections, rebuilt
            - One list on the left, everything about the selected collection on the right. You pick a collection once and it stays picked while you move between tabs — no more choosing it again in a separate dropdown.
            - **Export preview**, **Items** and **Filtered out** are now tabs instead of panels that pushed the rest of the list down the page.
            - **Export JSON** is a real button instead of the fifth in a row of identical grey links.
            - **Filtered out** shows exactly which rows a smart filter is removing from the collection you're looking at, and which pattern did it.
            - Smart filters open with a live summary of what they're currently doing — "Removing 7 rows across 3 collections" — instead of leaving you to guess.
            - A collection that produces no export rows now tells you why: content that only routes into other Dialogs, everything caught by a filter, items that no longer exist in the loaded export, or simply an empty collection. Each one needs a different fix, so each one says something different.

            ### Share Content, rebuilt
            - You can now trim what you're about to share: filter the list, or remove individual rows with the ✕. The counter and the copy button follow along, so what you see is exactly what lands on the clipboard.
            - The copy button says how much it will copy — "Copy 5 links", "Copy table (5 rows)".
            - Each view now explains what it produces, so "Grouped" no longer silently swaps response text for Dialog → Article links without telling you.
            - Every row carries a type badge, so a Dialog and a Transactional Dialog are finally distinguishable (both use the `dn-` prefix).
            - If no CM.com Context URL is configured, the header now says so — copied "links" would otherwise quietly come out as plain IDs.

            ### Article and Dialog windows
            - Sized to their content instead of filling the whole screen. A short Article is now a short window, and answers wrap at a readable width instead of stretching across the display.
            - Articles with many entity phrases collapse them behind a "+N more", so the response is visible immediately.
            - Long answers get a **Show full response** button instead of their own hidden scrollbar.
            - Section headings stay in view while you scroll a long list of nodes.
            - **Matches only** replaces the old `⊵q` symbol, and only appears when a search is actually running.
            - New **Linked from Articles**: which Articles route people into this Dialog. For Transactional Dialogs — which previously showed nothing at all — this is the whole story.
            - **Back** only appears when there's somewhere to go back to.

            ### Importing stays fast as your database grows
            - Importing a long date range is around **7× faster** on a large database, and the gap widens the more data you have stored. The end-of-import work now runs once per import instead of once per day downloaded.
            - The search index no longer keeps a second copy of every message: **23% faster to import, 37% smaller on disk**, with search speed unchanged.
            - Three indexes that cost time on every imported row and were never actually used have been removed.
            - The import window's Details log now reports where the time actually went, phase by phase.
            - An import that is cancelled or interrupted now repairs itself the next time you open the database.

            ### Smaller things
            - A quiet hour — a night with genuinely no conversations — is no longer mistaken for a gap and re-downloaded on every run.
            - New **Compact database** button (Manage Database → Database & retention) reclaims disk space after deletions.
            - The top bar no longer shows "2/2 sources" when everything loaded fine. It now only speaks up when something is missing, and names it.

            ---

            ## Download

            ### Windows (geen admin nodig, geen installatie) — aanbevolen
            - Klik hieronder op **Assets** en download:
              `Conversational-AI-Dashboard-portable-${{ github.ref_name }}-x64.zip`
            - Pak het zip-bestand uit en dubbelklik op `CAIDashboard.exe`.
            - Geen installatie nodig. Je kunt het bestand op elke locatie bewaren.

            > ⚠️ Let op: de app is niet gecode‑signed. Windows Defender/SmartScreen kan een waarschuwing tonen.
            > Klik op **"Meer informatie" → "Toch uitvoeren"** om de app te starten.

            ---

            ### macOS
            - Download het `.dmg`‑bestand.
            - Open het `.dmg`, sleep de app naar `Applications` en open hem via `Launchpad`/`Programma's`.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Zip portable Windows binary
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "src-tauri/target" -Recurse -Filter "CAIDashboard.exe" |
            Where-Object { $_.FullName -match "\\release\\" -and $_.FullName -notmatch "\\(deps|build|examples)\\" } |
            Select-Object -First 1
          if (-not $exe) { Write-Error "CAIDashboard.exe not found"; exit 1 }
          Write-Host "Found binary: $($exe.FullName)"
          $version = "${{ github.ref_name }}"
          $zipName = "Conversational-AI-Dashboard-portable-${version}-x64.zip"
          Compress-Archive -Path $exe.FullName -DestinationPath $zipName
          echo "ZIP_PATH=$zipName" >> $env:GITHUB_ENV

      - name: Upload portable zip to release
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
