name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Only the macOS job creates the release and writes `latest.json`, so
      # this is no longer about a read-modify-write race. It is about order:
      # the Windows job uploads into a release that has to already exist, with
      # the body and draft flag the macOS job sets. Matrix `include` order is
      # the run order at max-parallel 1.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          # --no-bundle because Windows ships only the portable zip, which the
          # steps below build from the plain .exe. There is no Windows bundle
          # left to produce: `bundle.targets` is macOS-only.
          - platform: windows-latest
            args: "--no-bundle"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Save the cache even if a later step (e.g. notarization) fails —
          # otherwise a full crate recompile is thrown away on every retry.
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      # macOS only. tauri-action builds the .dmg plus the updater .app.tar.gz
      # and its .sig, creates the release, and writes latest.json.
      #
      # It cannot be used for Windows: that job builds with --no-bundle and so
      # produces no bundles at all, and tauri-action treats "nothing to upload"
      # as a failure — `##[error]No artifacts were found.` after a perfectly
      # good 7-minute compile. That is what half-published v0.13.1.
      - name: Build and publish (macOS)
        if: matrix.platform == 'macos-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts. Without these the build still succeeds
          # but produces no .sig files, and every client rejects the update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          # This text is also the release-notes panel inside the app's update
          # dialog: tauri-action copies the release body into `latest.json` as
          # `notes`, and `check_for_updates` passes it to the renderer. Rewrite
          # the "What's new" section per release — stale notes are now visible in
          # two places. The heading takes the tag so at least the version cannot
          # go stale on its own. English only: the audience is mixed.
          releaseBody: |
            ## What's new in ${{ github.ref_name }}

            ### Narrow a Dialog to one of its nodes, without retyping it

            When you search conversations by **#ID**, a Dialog you have picked
            now shows a small ▾. Click it and you get that Dialog's nodes, by
            name — *Camper of caravan*, *Elektrische auto's*, *Hotels &
            Resorts* — so you can go from "conversations that touched this
            Dialog" to "conversations that reached *this node* of it" in one
            click.

            On a real database that took one search from **48 conversations
            down to the 1** that actually reached the node.

            **Whole dialog** sits at the top of the same list, so widening back
            out is one click too, and the entry you are currently on is marked
            so the list reads as a choice you are editing rather than a fresh
            one. Articles and Transactional Dialogs have no nodes, so those tags
            stay plain — nothing looks clickable unless it does something.

            ---

            ## Download

            Click **Assets** below and pick the file for your computer. You only
            need to do this once — after that the app updates itself.

            ### Windows
            `Conversational-AI-Dashboard-portable-${{ github.ref_name }}-x64.zip`

            - Unzip it and double-click `CAIDashboard.exe`.
            - No installation, no administrator rights. Keep it wherever you like —
              but pick a folder you can write to, so the app can update itself.

            > ⚠️ The app is not code-signed, so Windows Defender/SmartScreen may
            > warn you. Click **"More info" → "Run anyway"**. This is a one-off:
            > updates the app downloads itself start without that warning.

            ### macOS (Apple Silicon)
            `Conversational.AI.Dashboard_*_aarch64.dmg`

            - Open the `.dmg`, drag the app to `Applications`, and start it from
              Launchpad.
          # Published only by the finalize job, once every artifact this
          # release needs is on it and latest.json names every platform. A
          # draft is not served by `releases/latest/download/latest.json`, so
          # a run that dies half way leaves clients on the previous version
          # instead of showing them an incomplete one.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Windows ships one artifact, the portable zip, built from the plain .exe
      # by the steps below — so this is a plain build with no publishing step.
      - name: Build Windows binary
        if: matrix.platform == 'windows-latest'
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Zip portable Windows binary
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "src-tauri/target" -Recurse -Filter "CAIDashboard.exe" |
            Where-Object { $_.FullName -match "\\release\\" -and $_.FullName -notmatch "\\(deps|build|examples)\\" } |
            Select-Object -First 1
          if (-not $exe) { Write-Error "CAIDashboard.exe not found"; exit 1 }
          Write-Host "Found binary: $($exe.FullName)"
          $version = "${{ github.ref_name }}"
          $zipName = "Conversational-AI-Dashboard-portable-${version}-x64.zip"
          Compress-Archive -Path $exe.FullName -DestinationPath $zipName
          echo "ZIP_PATH=$zipName" >> $env:GITHUB_ENV

      # The portable zip is not one of the artifacts tauri-action signs — it is
      # built here, and on a runner tauri-action never touches. It is what the
      # portable build downloads to update itself, so it needs a signature of
      # its own — from the same key, verified by the same pubkey in
      # tauri.conf.json.
      - name: Sign portable zip
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx --yes @tauri-apps/cli@2 signer sign "$env:ZIP_PATH"
          if (-not (Test-Path "$($env:ZIP_PATH).sig")) {
            Write-Error "signer produced no .sig for $env:ZIP_PATH"; exit 1
          }

      # `gh release upload` rather than an action that creates-or-updates:
      # the release already exists as a draft and this must upload *into* it,
      # never publish one of its own.
      - name: Upload portable zip to release
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" `
            "$env:ZIP_PATH" "$($env:ZIP_PATH).sig" `
            --repo "${{ github.repository }}" --clobber

  # `latest.json` is what every installed copy reads to decide whether there is
  # an update and which artifact to fetch. tauri-action writes one entry per
  # bundle it produced — but the portable zip is not one of its bundles, so the
  # key the portable build asks for (`windows-portable`, from
  # `self_update::updater_target`) has to be added afterwards.
  #
  # A separate job rather than another step in the Windows one: `needs: build`
  # puts it strictly after both platforms, which is the only point at which the
  # release can be judged complete.
  #
  # It is also the gate. The release is a draft until this job verifies it and
  # publishes it, so every way a run can fail — a build error, a missing
  # artifact, a manifest that doesn't name a platform — leaves clients on the
  # previous version rather than on a release that only works for some of them.
  # v0.13.1 is why: the Windows job died, `latest.json` shipped with only the
  # darwin keys, and every portable copy read that and reported itself up to
  # date. Silently, and permanently — a missing platform key is not an error to
  # the updater, it is an answer.
  finalize-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Complete latest.json, verify the release, publish it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ZIP="Conversational-AI-Dashboard-portable-${TAG}-x64.zip"

          gh release download "$TAG" --repo "$REPO" --pattern 'latest.json' --clobber
          gh release download "$TAG" --repo "$REPO" --pattern "${ZIP}.sig" --clobber

          # What the release must actually contain. `gh` lists a draft's assets
          # the same as a published one's.
          gh release view "$TAG" --repo "$REPO" --json assets \
            --jq '.assets[].name' | sort > assets.txt
          echo "assets on the release:"
          sed 's/^/  /' assets.txt

          node -e '
            const fs = require("fs")
            const [zip, tag, repo] = process.argv.slice(1)
            const manifest = JSON.parse(fs.readFileSync("latest.json", "utf8"))
            const assets = new Set(
              fs.readFileSync("assets.txt", "utf8").split("\n").filter(Boolean)
            )

            // A stale manifest would hand every client the wrong artifact while
            // looking entirely healthy, so fail the release instead.
            if (manifest.version !== tag.replace(/^v/, "")) {
              throw new Error(
                `latest.json is for ${manifest.version}, tag is ${tag}`
              )
            }

            manifest.platforms = manifest.platforms || {}
            manifest.platforms["windows-portable"] = {
              signature: fs.readFileSync(zip + ".sig", "utf8").trim(),
              url: `https://github.com/${repo}/releases/download/${tag}/${zip}`,
            }

            // Every target an installed copy can ask for. `self_update::
            // updater_target` returns "windows-portable"; the plugin derives
            // "darwin-aarch64" itself. A key missing here is a platform that
            // would go on reporting itself up to date forever, so it fails the
            // release while the release is still a draft nobody can see.
            //
            // If the NSIS installer ever comes back, add windows-x86_64-nsis.
            const required = ["windows-portable", "darwin-aarch64"]
            const missing = required.filter((k) => !manifest.platforms[k])
            if (missing.length) {
              throw new Error(
                `latest.json is missing platform(s): ${missing.join(", ")}`
              )
            }

            // A key pointing at an artifact that was never uploaded fails the
            // same way at download time instead of at check time. Both halves
            // have to be there.
            const dangling = []
            for (const [key, p] of Object.entries(manifest.platforms)) {
              const name = decodeURIComponent(p.url.split("/").pop())
              if (!assets.has(name)) dangling.push(`${key} -> ${name}`)
              if (!p.signature) dangling.push(`${key} -> empty signature`)
            }
            if (dangling.length) {
              throw new Error(
                "latest.json points at artifacts that are not on the release:\n  " +
                  dangling.join("\n  ")
              )
            }

            fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2))
            console.log("platforms: " + Object.keys(manifest.platforms).join(", "))
          ' "$ZIP" "$TAG" "$REPO"

          gh release upload "$TAG" latest.json --repo "$REPO" --clobber

          # Only now is the release fit to be the one every client reads.
          gh release edit "$TAG" --repo "$REPO" --draft=false
          echo "published $TAG"
