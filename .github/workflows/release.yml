name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Save the cache even if a later step (e.g. notarization) fails —
          # otherwise a full crate recompile is thrown away on every retry.
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: |
            ## What's new in v0.10.3

            ### Large collections are fast again
            - A collection with hundreds of items no longer bogs the window down. The work of turning your Articles and Dialogs into export rows now happens once and is reused, instead of being redone every time the window redraws — which was several times per click, and again on every keystroke while searching.
            - Typing in a collection's search box no longer stutters, and hovering cards while selecting content is instant again.
            - Very long lists load in pages of 200 with a **Show more** button. The count above the list always tells you the real total.

            ### You can now remove individual content from an export
            - **✕** on any row in **Export preview** takes that response out of the export.
            - **Hold out** in the **Items** tab takes a whole Article or Dialog out, while leaving it in the collection.
            - Both are remembered: if you add the same item again from the Content tab, it stays out. Removing an item from the collection and re-adding it does *not* quietly bring its content back.
            - Nothing disappears without a trace — everything you remove is listed under **Filtered out** with a **Restore** button.

            ### Search across the whole collection
            - **Filtered out** and **Items** are now searchable, alongside **Export preview**.
            - The **Items** search matches the text of the responses an item produces, not just its name. Find a line you don't want in the export, and it tells you which Article or Dialog is putting it there.
            - Your search term carries across the tabs, so "it's not in the export — was it filtered out?" is one click.
            - In **Filtered out** you can also search on the reason, so typing a pattern's name lists exactly what that pattern removed.

            ### Smart filters, per collection
            - A new **Filters** tab on each collection shows which of your global patterns apply to it, and how many rows each one removes *there*.
            - Switch one off for a single collection without touching it for any other.

            ### Unreachable responses are no longer removed silently
            - Responses a user can never reach — not the default, and no context set — have always been left out of exports. Now it's a setting you can see, with a count of what it's removing, and the rows it drops show up under **Filtered out** with the reason.
            - **Fixed:** a Dialog response whose context was set to `any` was treated as reachable and exported, while the same thing on an Article was not. `any` matches everyone, so it isn't a condition — both now agree, and such responses are correctly marked unreachable throughout the app.

            ### Under the hood
            - New automated checks (`npm run test:frontend`) build an export from content designed to be excluded in every possible way, then scan the produced JSON for anything that shouldn't be there — including the tricky case where a held-out item shares its wording with one you kept.

            ---

            ## Download

            ### Windows (geen admin nodig, geen installatie) — aanbevolen
            - Klik hieronder op **Assets** en download:
              `Conversational-AI-Dashboard-portable-${{ github.ref_name }}-x64.zip`
            - Pak het zip-bestand uit en dubbelklik op `CAIDashboard.exe`.
            - Geen installatie nodig. Je kunt het bestand op elke locatie bewaren.

            > ⚠️ Let op: de app is niet gecode‑signed. Windows Defender/SmartScreen kan een waarschuwing tonen.
            > Klik op **"Meer informatie" → "Toch uitvoeren"** om de app te starten.

            ---

            ### macOS
            - Download het `.dmg`‑bestand.
            - Open het `.dmg`, sleep de app naar `Applications` en open hem via `Launchpad`/`Programma's`.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Zip portable Windows binary
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "src-tauri/target" -Recurse -Filter "CAIDashboard.exe" |
            Where-Object { $_.FullName -match "\\release\\" -and $_.FullName -notmatch "\\(deps|build|examples)\\" } |
            Select-Object -First 1
          if (-not $exe) { Write-Error "CAIDashboard.exe not found"; exit 1 }
          Write-Host "Found binary: $($exe.FullName)"
          $version = "${{ github.ref_name }}"
          $zipName = "Conversational-AI-Dashboard-portable-${version}-x64.zip"
          Compress-Archive -Path $exe.FullName -DestinationPath $zipName
          echo "ZIP_PATH=$zipName" >> $env:GITHUB_ENV

      - name: Upload portable zip to release
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
